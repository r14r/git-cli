<text x="96" y="28" class="title">04-gitignore.svg</text>
<text x="36" y="72" class="line">$ git-cli gitignore add --for django</text>
<text x="36" y="100" class="line">Updated: /project/.gitignore</text>
<text x="36" y="128" class="line">Section: django</text>
<text x="36" y="156" class="line"></text>
<text x="36" y="184" class="line">$ git-cli gitignore explain .env</text>
<text x="36" y="212" class="line">.gitignore:42:.env    .env</text>
<text x="36" y="240" class="line"></text>
<text x="36" y="268" class="line">$ git-cli gitignore status</text>
<text x="36" y="296" class="line">Managed sections:</text>
<text x="36" y="324" class="line">  - django</text>
</svg>