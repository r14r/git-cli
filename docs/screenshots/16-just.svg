<text x="96" y="28" class="title">16-just.svg</text>
<text x="36" y="72" class="line">$ just</text>
<text x="36" y="100" class="line">Available recipes:</text>
<text x="36" y="128" class="line">    build                 # Build the versioned binary.</text>
<text x="36" y="156" class="line">    check                 # Run formatting, vet and tests.</text>
<text x="36" y="184" class="line">    doctor                # Run git-cli doctor.</text>
<text x="36" y="212" class="line">    actions-list          # List GitHub Actions runs.</text>
<text x="36" y="240" class="line">    pat-status            # Show PAT storage status.</text>
