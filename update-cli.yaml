schemaVersion: 2
project:
  name: git-cli
  type: go
variables:
  binary: git-cli
  repository: https://github.com/r14r/git-cli.git
  distDir: dist
workflows:
  setup:
    tasks: [install]
  ci:
    tasks: [verify]
tasks:
  prepare:
    steps:
      - name: Download Go modules
        go:
          action: mod-download
  check:
    requires: [prepare]
    steps:
      - name: Vet
        go:
          action: vet
      - name: Test
        go:
          action: test
  build:
    requires: [check]
    steps:
      - name: Build versioned git-cli
        shell: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p "{{ distDir }}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "{{ distDir }}/{{ binary }}" ./cmd/git-cli
  verify:
    requires: [build]
    steps:
      - name: Verify binary
        assert:
          executable: "{{ distDir }}/{{ binary }}"
      - name: Verify embedded version
        shell: |
          set -eu
          expected="$(tr -d '\r\n' < VERSION)"
          actual="$("./{{ distDir }}/{{ binary }}" --version | awk '{print $2}')"
          if [ "$actual" != "$expected" ]; then
            echo "Version mismatch: expected $expected, got $actual"
            exit 1
          fi
  install:
    requires: [verify]
    steps:
      - name: Install git-cli
        deploy:
          source: "{{ distDir }}/{{ binary }}"
          target: "/usr/local/bin/{{ binary }}"
          mode: "0755"
  clean:
    steps:
      - name: Clean build artifacts
        remove:
          path: "{{ distDir }}"
          recursive: true
